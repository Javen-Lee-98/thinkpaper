<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>笔触试写</title>
<!-- 临时页面（2026-11-12）：让用户在平板上试三种候选笔触，选定后把选中的做进正式页面，这一页删掉。
     这一页不存任何东西、不和服务说话；刷新就清空。 -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  canvas { position: fixed; left: 0; top: 0; touch-action: none; }
  #bar { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 6px); display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 0 12px; z-index: 2; pointer-events: none; }
  #bar button { pointer-events: auto; height: 40px; padding: 0 14px; border: 1px solid #d9d2c3; border-radius: 20px; background: rgba(255, 253, 248, .94);
    color: #333; font-size: 15px; }
  #bar button.on { background: #fff; border-color: #222; box-shadow: inset 0 0 0 1px #222; font-weight: 600; }
  #bar .gap { flex: 1; }
  #what { position: fixed; left: 14px; right: 14px; top: calc(env(safe-area-inset-top) + 56px); color: #7a7468; font-size: 14px; line-height: 1.5;
    z-index: 2; pointer-events: none; }
</style>
</head>
<body>
<canvas id="ink"></canvas>
<canvas id="live"></canvas>
<div id="bar">
  <button data-kind="even">笔触 1</button>
  <button data-kind="pen">笔触 2</button>
  <button data-kind="bold">笔触 3</button>
  <button data-kind="legacy">现在的</button>
  <button data-size="0.8">细</button>
  <button data-size="1">中</button>
  <button data-size="1.3">粗</button>
  <span class="gap"></span>
  <button id="red">红笔</button>
  <button id="undo">撤销</button>
  <button id="clear">清空</button>
</div>
<div id="what"></div>
<script src="/static/brush.js"></script>
<script>
'use strict';
(function () {
  const W = 1000, BASE = 2.1, INK = '#1b1b1b', RED = '#d23c2e'; // 和正式页面一样：纸宽 1000，笔的基本粗细 2.1
  const WHAT = {
    even: '笔触 1：线条做顺，比现在粗一些、黑一些，从头到尾一样粗，收笔略尖。',
    pen: '笔触 2：像钢笔。写得慢的地方粗、快的地方细；入笔由细到粗，甩出去的撇、捺、钩尾巴是尖的，顿住的收笔是钝的。',
    bold: '笔触 3：像笔触 2，但更粗，粗细起伏和笔锋更明显。',
    legacy: '现在的画法，对照用：从头到尾一样细。',
  };
  const cvInk = document.getElementById('ink'), cvLive = document.getElementById('live');
  const S = { kind: 'pen', size: 1, red: false, strokes: [], cur: null, s: 1, dpr: 1 }; // size：细 0.8、中 1、粗 1.3（「现在的」不受它影响）
  window.__brush = S; // 方便自动测试

  function resize() {
    S.dpr = window.devicePixelRatio || 1;
    S.s = innerWidth / W; // 纸宽正好铺满屏幕
    for (const c of [cvInk, cvLive]) {
      c.width = Math.round(innerWidth * S.dpr);
      c.height = Math.round(innerHeight * S.dpr);
      c.style.width = innerWidth + 'px';
      c.style.height = innerHeight + 'px';
    }
    redraw();
  }
  function setT(ctx) { ctx.setTransform(S.dpr * S.s, 0, 0, S.dpr * S.s, 0, 0); }
  function paint(ctx, st, done) {
    const color = st.c === 'r' ? RED : INK;
    if (S.kind === 'legacy') Brush.legacy(ctx, st.pts, BASE, color);
    else Brush.draw(ctx, st.pts, BASE * S.size, S.kind, color, done);
  }
  function redraw() {
    const ctx = cvInk.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cvInk.width, cvInk.height);
    setT(ctx);
    ctx.fillStyle = '#d8d3c8'; // 点阵，和正式页面的纸一样
    for (let y = 40; y < innerHeight / S.s; y += 40) for (let x = 40; x < W; x += 40) ctx.fillRect(x - 0.9, y - 0.9, 1.8, 1.8);
    for (const st of S.strokes) paint(ctx, st, true);
    drawLive();
  }
  function drawLive() {
    const ctx = cvLive.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cvLive.width, cvLive.height);
    if (!S.cur) return;
    setT(ctx);
    paint(ctx, S.cur, false);
  }
  const r1 = (v) => Math.round(v * 10) / 10;
  const pressureOf = (e) => (e.pointerType === 'mouse' ? 0.5 : Math.max(0.08, Math.min(1, e.pressure || 0.5)));

  // 只有笔（和电脑上的鼠标）写字；手指、手掌碰到不算
  cvLive.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch' || S.cur) return;
    cvLive.setPointerCapture(e.pointerId);
    S.cur = { pts: [[r1(e.clientX / S.s), r1(e.clientY / S.s), Math.round(pressureOf(e) * 100) / 100, 0]], c: S.red ? 'r' : '', _pid: e.pointerId, _t0: e.timeStamp };
    drawLive();
  });
  cvLive.addEventListener('pointermove', (e) => {
    if (!S.cur || e.pointerId !== S.cur._pid) return;
    const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    for (const ev of evs.length ? evs : [e]) {
      const x = ev.clientX / S.s, y = ev.clientY / S.s, p = S.cur.pts, last = p[p.length - 1];
      if (Math.hypot(x - last[0], y - last[1]) < 0.35) continue;
      p.push([r1(x), r1(y), Math.round(((pressureOf(ev) + last[2]) / 2) * 100) / 100, Math.max(last[3], Math.round(ev.timeStamp - S.cur._t0))]);
    }
    drawLive();
  });
  function finish(e) {
    if (!S.cur || e.pointerId !== S.cur._pid) return;
    const st = S.cur;
    S.cur = null;
    delete st._pid; delete st._t0;
    S.strokes.push(st);
    const ctx = cvInk.getContext('2d');
    setT(ctx);
    paint(ctx, st, true);
    drawLive();
  }
  cvLive.addEventListener('pointerup', finish);
  cvLive.addEventListener('pointercancel', finish);

  function setKind(k) {
    S.kind = k;
    document.querySelectorAll('#bar [data-kind]').forEach((b) => b.classList.toggle('on', b.dataset.kind === k));
    document.getElementById('what').textContent = WHAT[k] + '　写过的字会跟着换成这种笔触，方便对照。';
    redraw();
  }
  document.querySelectorAll('#bar [data-kind]').forEach((b) => b.addEventListener('click', () => setKind(b.dataset.kind)));
  function setSize(v) {
    S.size = v;
    document.querySelectorAll('#bar [data-size]').forEach((b) => b.classList.toggle('on', Number(b.dataset.size) === v));
    redraw();
  }
  document.querySelectorAll('#bar [data-size]').forEach((b) => b.addEventListener('click', () => setSize(Number(b.dataset.size))));
  setSize(1);
  document.getElementById('red').addEventListener('click', (e) => { S.red = !S.red; e.target.classList.toggle('on', S.red); });
  document.getElementById('undo').addEventListener('click', () => { S.strokes.pop(); redraw(); });
  document.getElementById('clear').addEventListener('click', () => { S.strokes = []; redraw(); });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  window.addEventListener('resize', resize);
  setKind('pen');
  resize();
})();
</script>
</body>
</html>
