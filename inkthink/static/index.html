<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="草稿纸">
<!-- 从主屏幕打开时：没有 Safari 界面，页面延伸到状态栏下面 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fffdf8">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>ThinkPaper 草稿纸</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/katex/katex.min.css">
<link rel="preload" href="/static/fonts/xiaolai-gb2312.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<header id="bar">
  <div class="grp grow">
    <button id="drawerBtn" aria-label="本子和页面">☰<span class="new-dot" hidden></span></button><!-- 小圆点：有没处理的新文件（抽屉最上面那一组） -->
    <!-- 名字长的可以左右滑着看全 -->
    <div id="nbTitle" class="nb-title" role="button" aria-label="本子和页面">草稿本</div>
  </div>
  <div class="grp">
    <button id="prev" aria-label="上一页">‹</button>
    <span id="pageNo" role="button">–</span><!-- 页码：点了出输入页码的小框（#pageJump） -->
    <button id="next" aria-label="下一页">›</button>
    <!-- 别的页有新回答：「● 第 3 页」点了翻过去；几页时「● 2 页有新回答 ▾」点了出小单子（和左上角的 #chipNew 一样，app.js 的 showNewAns） -->
    <button id="barNew" class="new-ans-btn" hidden><span class="na-dot" aria-hidden="true"></span><span class="na-no"></span><span class="na-more" aria-hidden="true"></span></button>
    <!-- 单页 / 连续：并排的一对图标，当前的那个加框；点哪个就是哪个（和左上角那一对、抽屉里那组开关同一个状态）；只有一页的本子没有 -->
    <div class="pair" id="barPair" role="group" hidden>
      <button id="barSingle" data-v="single" data-icon="single" aria-label="单页：一页一页翻"></button>
      <button id="barCont" data-v="flow" data-icon="cont" aria-label="连续：上下页接在一起"></button>
    </div>
    <!-- 加页图标：在这一页后面加一张和它同方向的空白页并翻过去（和左上角的同一个按钮） -->
    <button id="barAdd" data-icon="addv" aria-label="在这一页后面加一张空白页" hidden></button>
  </div>
  <div class="grp">
    <!-- 回答要多长：和右下角那一条上的 #sizeBtn 是同一个开关，点开在下面出 #sizePick -->
    <!-- 顶栏挤不下时（窄屏、英文、「别的页有新回答」的记号长）名字换成三格小格子（亮几格是第几档，.tight，app.js 的 fitBarSize） -->
    <button id="barSize" class="size-btn" data-size="clear" aria-label="回答要多长：点开选"><span class="sz-meter" aria-hidden="true"><i></i><i></i><i></i></span><span class="sz-name">讲清楚</span><span class="sz-caret" aria-hidden="true">▾</span></button>
    <button id="barCheck" class="primary">AI</button><!-- 退出全屏后，顶栏上的「AI」：字跟着这一轮走，和右下角的同一个样子（app.js 的 updateCheck） -->
    <button id="menuBtn" aria-label="更多">⋯</button>
  </div>
</header>

<!-- 左侧工具栏（图标；长按看说明）。黑笔、红笔、橡皮的说明和右下角那一条上的同一个工具一字不差（界面上对用户说「你」） -->
<nav id="rail">
  <button data-tool="pen" class="on" data-icon="pen" aria-label="黑笔：你自己的推导和草稿"></button>
  <button data-tool="red" class="red-pen" data-icon="pen" aria-label="红笔：明确要 Claude 处理的事"></button>
  <button data-tool="eraser" data-icon="eraser" aria-label="橡皮：也能擦 Claude 的蓝字"></button>
  <button data-tool="lasso" data-icon="lasso" aria-label="套索：圈住你的几笔，按住框里拖到别处"></button><!-- 画一圈选中笔迹、拖着挪（app.js 的 lassoDown，static/lasso.js） -->
  <button id="undo" data-icon="undo" aria-label="撤销"></button>
  <button id="redo" data-icon="redo" aria-label="恢复" disabled></button><!-- 恢复（重做，英文 Redo；2026-11-16 夜以前叫「重做」）：撤销过才能点，否则是灰的（app.js 的 updateRedo） -->
  <span class="rail-gap"></span>
  <button id="fsBtn" title="全屏：隐藏浏览器界面、收起上栏和工具栏，只留纸">全屏</button>
</nav>

<main id="stage">
  <canvas id="bg"></canvas>
  <canvas id="ink"></canvas>
  <canvas id="live"></canvas>
  <svg id="ai" xmlns="http://www.w3.org/2000/svg"><g id="aiRoot"></g></svg>
  <div id="tex"></div><!-- 排好的公式（KaTeX），和批注层一起缩放 -->
  <!-- 纸的四边：点一下往那个方向加一块纸（笔写到边上附近时会亮起来）。只在书页、推送页；空白本子的纸跟着字长，没有这四个 -->
  <button id="extDown" class="ext" hidden>＋ 加长</button>
  <button id="extRight" class="ext" hidden>＋<br>加<br>宽</button>
  <button id="extUp" class="ext" hidden>＋ 向上加长</button>
  <button id="extLeft" class="ext" hidden>＋<br>向<br>左<br>加<br>宽</button>
</main>

<!-- 长回答的卡片：点纸上的圈号，紧挨着它浮出来（不是画在纸上的）；点别处、黑笔落下、挪纸、翻页、开抽屉就收起。
     红笔落在卡片里写在卡片上（acInk 那一层，和内容一起缩放、一起滑），橡皮擦卡片上的红字；手指在卡片里上下滑。
     内容（acPage）按固定宽度排版，整体缩放到卡片的宽度：换屏幕大小红字不错位。Claude 接着回的各段在 acMore 里，之前的版本在最底下。
     Claude 写的字不翻译（data-lang-keep） -->
<div id="answerCard" role="dialog" hidden>
  <!-- 顶上的「上一条」「下一条」（2026-11-16 用户定，暂定）：按这一页圈号的顺序换到相邻那条回答的卡片，到头的那个变灰；
       这一页只有一条回答时不出；不跨页。贴在卡片顶上，卡片里的内容滑动时它不动（不在 acPage 里：不影响红字的坐标） -->
  <div id="acNav" hidden><button id="acPrev">‹ 上一条</button><button id="acNext">下一条 ›</button></div>
  <div id="acSizer">
    <div id="acPage">
      <div class="ac-blk" id="acMain" data-blk="a">
        <div class="ac-q" id="acQ" hidden><span class="ac-qh">问：</span><span class="ac-qt" id="acQt" data-lang-keep></span></div>
        <div class="ac-body" id="acBody" data-lang-keep></div>
      </div>
      <div id="acMore"></div>
      <div class="ac-older" id="acOlder" hidden><div class="ac-oh ac-blk" data-blk="oh">之前的版本</div><div class="ac-olist" id="acOlist" data-lang-keep></div></div>
      <svg id="acInk" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <!-- 卡片底下一排（2026-11-17，暂定）：「摊在纸上」（收着的）/「收起」（摊开着的），只在空白本子里有；「再短点」「展开讲」：请写这条回答的
       对话按新的长短重写，接在这张卡片下面（交了以后那个钮写「已交」，回应到了恢复）。贴在卡片底下，内容滑动时它不动（不在 acPage 里：
       不影响红字的坐标）；小蓝点浮出来的小卡片上没有 -->
  <div id="acActs" hidden><button id="acSpread" data-act="open">摊在纸上</button><span class="ac-fill"></span><button id="acShorter" data-want="brief">再短点</button><button id="acLonger" data-want="full">展开讲</button></div>
</div>

<!-- 左侧抽屉：本子、页面缩略图、加页删页 -->
<aside id="drawer" hidden>
  <!-- 新文件（阶段 D2）：Claude 在对话里新生成、还没处理的文件，一个一行（文件名、哪个对话生成的、加入 / 更新《某本》/ 替换《某本》/ 另加一本、忽略）。
       放在最上面；条数多时这一组限高、在里面滑，不把下面那两组开关挤到要往下划才看得到。没有待处理的就不出 -->
  <div id="offerBox" hidden>
    <div class="of-head"><span id="offerHead">新文件</span><button id="offerAll" hidden>全部忽略</button></div>
    <div id="offerList"></div>
  </div>
  <!-- 怎么翻页、纸多大。放在最上面，本子再多也不用往下划；当前选的那个加框 -->
  <div class="dr-row" id="viewRow">
    <div class="seg" id="segFlow"><button data-v="flow">连续</button><button data-v="single">单页</button></div>
    <div class="seg" id="segFit"><button data-v="width">适配宽度</button><button data-v="page">整页</button></div>
  </div>
  <div class="dr-head">本子</div>
  <!-- 草稿本、Claude 推送；文件夹（点一下折叠 / 展开）和里面的本子；不在文件夹里的本子 -->
  <div id="nbList"></div>
  <div class="dr-row">
    <button id="actNewNb">＋ 新建本子…</button>
    <button id="actNewFolder">＋ 新建文件夹…</button>
  </div>
  <div class="dr-row">
    <button id="actUpload">导入文档…</button>
  </div>
  <div class="dr-row">
    <!-- 这本发往哪个对话，或「只在本地（不发给 Claude）」：点开在列表里选 -->
    <button id="actTarget" title="这本发往哪个对话：点一下换">这本发往：</button>
  </div>
  <!-- 页面那一行右边：作用在当前页的图标 -->
  <div class="dr-head dr-pages">页面 <span id="thumbCount"></span>
    <span class="dr-acts">
      <button id="actTurnL" data-icon="rotl" aria-label="这一页连同写的字左转 90°"></button>
      <button id="actTurnR" data-icon="rotr" aria-label="这一页连同写的字右转 90°"></button>
      <button id="actAddPortrait" data-icon="addv" aria-label="在这一页后面加一张竖版空白页"></button>
      <button id="actAddLandscape" data-icon="addh" aria-label="在这一页后面加一张横版空白页"></button>
      <!-- 复制这一页（2026-11-18）：点开选带什么，复制出的页接在这一页后面；书页、推送的页上灰着（app.js 的 openCopy） -->
      <button id="actCopyPage" data-icon="copy" aria-label="复制这一页…（选带什么，接在这一页后面）"></button>
      <button id="actDelPage" data-icon="trash" aria-label="删除这一页（可以在「显示已删的页」里还原）"></button>
    </span>
  </div>
  <div id="thumbs"></div>
  <div class="dr-row">
    <button id="actHidden">显示已删的页</button>
  </div>
  <div id="hiddenList" hidden></div>
  <!-- 抽屉最下面（全屏时没有「⋯」菜单，这几样在这里也有）：「Claude 读到了什么」「画线停住变直」（先藏着）的开关（和菜单里的是同一个）、再看一遍新手引导。
       再下面是语言切换（i18n.js 加在最后） -->
  <div class="dr-row dr-checks">
    <label class="dr-check"><input type="checkbox" id="drReads"> Claude 读到了什么</label>
  </div>
  <!-- 「画线停住变直」先藏着（2026-11-16 夜）：app.js 的 STRAIGHT_SHOWN 是 false 时这一行不在页面上（showStraight） -->
  <div class="dr-row dr-checks" hidden>
    <label class="dr-check"><input type="checkbox" id="drStraight"> 画线停住变直</label>
  </div>
  <div class="dr-row">
    <button id="actGuide2">再看一遍新手引导</button>
  </div>
</aside>

<div id="menu" class="panel" hidden>
  <label class="row"><input type="checkbox" id="optAi"> 显示 Claude 的批注</label>
  <!-- 勾上后每组笔迹下面用小号灰字写出 Claude 读到的字（阶段 D2），再点一次关掉；记在这台设备上 -->
  <label class="row"><input type="checkbox" id="optReads"> Claude 读到了什么</label>
  <label class="row"><input type="checkbox" id="optFinger"> 手指也能书写</label>
  <!-- 画一条线后笔不抬、停住约半秒，变成直线（static/straight.js）；记在这台设备上，默认开。
       2026-11-16 夜起先藏着：app.js 的 STRAIGHT_SHOWN 是 false 时这一行不在页面上、功能关着 -->
  <label class="row" hidden><input type="checkbox" id="optStraight"> 画线停住变直</label>
  <button class="row" id="actReplay">回放本页书写过程</button>
  <button class="row" id="actFit">整页 / 适配宽度</button>
  <button class="row" id="actClearAi">清除本页 Claude 批注</button>
  <button class="row" id="actGuide">再看一遍新手引导</button>
</div>

<!-- 这本发往哪个对话：每本记住自己的对话。按项目文件夹分组，每个对话写最近打的一句话、什么时候开的、多久前活跃；
     最下面一项「不发给 Claude（只在本地）」 -->
<div id="targetPick" class="panel" hidden>
  <div class="row small" id="targetPickHead"></div>
  <div id="targetPickList"></div>
  <button class="row" id="targetPickCancel">取消</button>
</div>

<!-- 输入页码翻页（2026-11-16 夜用户定，暂定）：点页码（顶栏上 ‹ › 中间的「3/12」、全屏时左上角的页码）出这个小框，放在页码下面、屏幕上方
     （平板的数字键盘从下面弹出，挡不住它）。只输数字（平板上出数字键盘）；从别处跳过来的，多一行「回到第 N 页」（app.js 的 openPageJump） -->
<div id="pageJump" class="panel" role="dialog" aria-label="输入页码翻页" hidden>
  <div class="pj-row"><span>翻到第</span><input id="pjInput" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="go" maxlength="5" autocomplete="off" aria-label="页码"><span id="pjTotal"></span><button id="pjGo" class="primary">去</button></div>
  <div id="pjErr" class="pj-err" role="alert" hidden></div>
  <button class="row" id="pjBack" hidden></button>
</div>

<!-- 「几页有新回答」的小单子（2026-11-16 夜）：点左上角、顶栏上的那个记号出来，在它正下方（屏幕上方）；每页一行「第 3 页」，
     点一行翻过去、收起；点外面收起（app.js 的 renderNewAnsList） -->
<div id="newAnsList" class="panel" role="menu" aria-label="有新回答的页" hidden></div>

<!-- 回答要多长（2026-11-17，暂定）：点「AI」旁边写着当前档的那个钮出来，挨着那个钮（右下角那一条上的在它上面，顶栏上的在它下面）；
     三行，每行写档名和一句说明，现在这一档白底加粗边框带 ✓；点一行就换成它、收起；点外面、再点那个钮、按 Esc 收起（app.js 的 openSizePick） -->
<div id="sizePick" class="panel" role="menu" aria-label="回答要多长（交给 AI 时带上）" hidden>
  <div class="row small">回答要多长（交给 AI 时带上）</div>
  <button class="row sz-row" data-size="brief"><span class="tp-main"><span class="tp-l1">点一下</span><span class="tp-l2">只给记号和一两句短批注，不展开</span></span></button>
  <button class="row sz-row" data-size="clear"><span class="tp-main"><span class="tp-l1">讲清楚</span><span class="tp-l2">短批注加必要的几步推导或一段话（默认）</span></span></button>
  <button class="row sz-row" data-size="full"><span class="tp-main"><span class="tp-l1">展开讲</span><span class="tp-l2">完整的长回答</span></span></button>
</div>

<!-- 一本右边的「⋯」点开的小菜单：放进文件夹…、改名…、删除这本…，当前这本有原 PDF 时多一项存回 PDF（app.js 的 nbMenuItems 填） -->
<div id="nbMenu" class="panel" role="menu" hidden></div>

<!-- 一本「⋯」菜单里的「放进文件夹…」点开：放进哪个文件夹、移出文件夹、新建文件夹 -->
<div id="folderPick" class="panel" hidden>
  <div class="row small">放进哪个文件夹</div>
  <div id="folderPickList"></div>
  <button class="row" id="folderPickCancel">取消</button>
</div>

<!-- 书页：原文件更新过 / 这一页有改动（对比旧版；Claude 改文件后换的新版还能「撤回这次修改」）。
     全屏时和左上角那一排同一行、靠右，退出全屏时在顶栏下面靠右（app.js 的 placeVer） -->
<div id="verchip" hidden>
  <span id="verText"></span>
  <button id="verAct"></button>
  <button id="verUndo" hidden></button>
  <button id="verClose" aria-label="收起">×</button>
</div>

<!-- 顶上的卡片（2026-11-14）：问话卡片（Claude 要你回答的问题，或纸上放不下的结果）和字迹确认卡片是同一种卡片、排同一个队。
     从屏幕顶上落下、居中，一次只显示一张；在卡片外的纸上落笔，它缩成顶上一小条（#qbar：问的是什么、还有几张），点小条再展开。
     问题：点一个选项，或用笔写在卡片里那一小块纸上（交的是笔迹的图，不转文字）；结果：点「知道了」；字迹确认：照旧（截图、候选、手写更正）。
     答了这张就消失，下一张落下。问题卡片底下左边有「忽略」（不答了，这张消失）；排着不止一张时另有「全部忽略（N 张）」。
     平板自己要问的一句（撤回修改前的确认）也用这张卡片。内容由 app.js 的 fillQ 按卡片的种类填 -->
<div id="qcard" role="dialog" hidden>
  <div class="qc-top"><b id="qcHead"></b><button id="qcLater" aria-label="收成顶上一小条，点它再打开">稍后</button></div>
  <div id="qcBody"></div>
  <div id="qcFoot"></div>
</div>
<button id="qbar" aria-label="点一下展开卡片" hidden><span id="qbarLead"></span><span id="qbarText" data-lang-keep></span><span id="qbarMore"></span></button>
<!-- 排着不止一张时，小条旁边的「全部忽略（N 张）」：一次清掉排着的所有卡片（2026-11-14 用户在 iPad 上试过后定） -->
<button id="qbarAll" hidden></button>

<!-- 新文件提示（阶段 D2）：Claude 在对话里生成了新文件，屏幕上方出一条「Claude 生成了某某 [加入] [忽略]」，约 8 秒后自己收起（没处理的进抽屉最上面那一组）。
     一次来了几个合成一条；排在左上角那一排（顶栏）下面，问话卡片排在它下面（app.js 的 placeOfferBar、placeQ） -->
<div id="offerBar" role="status" hidden><span id="obText"></span><span id="obBtns"></span></div>

<!-- 新手引导（阶段 D2）：真实的按钮旁各一个小标签（app.js 的 layoutGuide 量好位置，细线连到按钮），中间一张短说明。
     这一层不接点按，只有「知道了」接：落笔、点真实的按钮照常起作用，同时引导收起 -->
<div id="guide" hidden>
  <svg id="guideLines" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="guideTags"></div>
  <div id="guideCard" role="dialog" aria-label="新手引导">
    <div class="g-row"><span class="g-key g-black">黑笔</span><span>写你自己的草稿和推导</span></div>
    <div class="g-row"><span class="g-key g-red">红笔</span><span>写给 Claude 的话：问题或要求</span></div>
    <div class="g-row"><span class="g-key"><span class="g-ai">AI</span></span><span>写完点它，交给 Claude</span></div>
    <div class="g-row"><span class="g-key g-blue">蓝字</span><span>Claude 回在纸上；长的收在圈号里，点圈号看</span><span class="g-badge" aria-hidden="true">1</span></div>
    <div class="g-foot"><button id="guideOk" class="primary">知道了</button></div>
  </div>
</div>

<div id="toast" hidden></div>

<!-- 导入：浏览电脑上对话所在的文件夹，或搜 Zotero 里的文献，点一下导入；或从平板上传 -->
<div id="importSheet" class="overlay" hidden>
  <div class="card wide">
    <div class="is-top"><b>导入文档</b><button id="isClose" aria-label="关闭">×</button></div>
    <div class="is-tabs"><button data-tab="folder">电脑文件夹</button><button data-tab="zotero">Zotero</button></div>
    <div id="isFolder" class="is-pane">
      <div class="is-row"><span>电脑上的文件夹</span><select id="isSession" aria-label="哪个对话的文件夹"></select></div>
      <div id="isCrumbs"></div>
      <div id="isList"></div>
    </div>
    <div id="isZotero" class="is-pane" hidden>
      <input id="zq" type="search" placeholder="搜标题、作者、年份" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div id="zCrumbs"></div>
      <div id="zList"></div>
    </div>
    <div class="card-btns"><button id="isUpload">从平板上传…</button></div>
  </div>
</div>

<!-- 新建本子：名字 + 纸张方向 -->
<div id="newNb" class="overlay" hidden>
  <div class="card">
    <h3>新建本子</h3>
    <!-- 从文件夹那一行上的「＋」点开时（2026-11-18）：建好放进哪个文件夹 -->
    <p id="newNbIn" hidden></p>
    <input id="newNbTitle" placeholder="名字，比如：随笔、想法、读书笔记" autocomplete="off">
    <select id="newNbPaper" aria-label="纸张方向"><option value="portrait">竖版纸</option><option value="landscape">横版纸</option></select>
    <p>黑笔写你自己的；想让 Claude 做什么，用红笔写。</p>
    <div class="card-btns"><button id="newNbCancel">取消</button><button id="newNbOk" class="primary">建立</button></div>
  </div>
</div>

<!-- 复制这本…、复制这一页…（2026-11-18 用户提的）：和新建本子同一种卡片；带什么三选一，选中的白底加粗边框带 ✓（app.js 的 openCopy） -->
<div id="copyAsk" class="overlay" hidden>
  <div class="card" role="dialog" aria-labelledby="copyAskTitle">
    <h3 id="copyAskTitle"></h3>
    <div class="cp-opts" role="radiogroup" aria-label="复制时带什么">
      <button class="cp-opt" data-mode="all" role="radio"><span class="cp-l1">全部照样</span><span class="cp-l2">黑笔、红笔和 AI 写的都带上</span></button>
      <button class="cp-opt" data-mode="noai" role="radio"><span class="cp-l1">不带 AI 的蓝字</span><span class="cp-l2">留下你写的黑笔和红笔</span></button>
      <button class="cp-opt" data-mode="ink" role="radio"><span class="cp-l1">只留黑笔（不带红字和蓝字）</span><span class="cp-l2">只有你用黑笔写的</span></button>
    </div>
    <p id="copyAskWhere"></p>
    <div class="card-btns"><button id="copyAskCancel">取消</button><button id="copyAskOk" class="primary">复制</button></div>
  </div>
</div>

<!-- 给文件夹起名字（新建、改名）：和新建本子同一种卡片 -->
<div id="nameAsk" class="overlay" hidden>
  <div class="card">
    <h3 id="nameAskTitle">新建文件夹</h3>
    <input id="nameAskInput" placeholder="文件夹的名字" autocomplete="off">
    <div class="card-btns"><button id="nameAskCancel">取消</button><button id="nameAskOk" class="primary">好</button></div>
  </div>
</div>

<div id="locked" class="overlay" hidden>
  <div class="card">
    <h3>需要访问码</h3>
    <p>在电脑上打开二维码页扫码，或输入服务启动时打印的访问码（链接里 <code>k=</code> 后面那段）。</p>
    <input id="codeInput" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="codeOk" class="primary">进入</button>
  </div>
</div>

<!-- 从平板上传：收的扩展名和电脑上的服务能导入的一样（server.py 的 IMPORT_EXT；tests/test_server.py 的 ImportKindsTest 守着） -->
<input type="file" id="pdfFile" accept=".pdf,.ppt,.pptx,.doc,.docx,.rtf,.odt,.odp,.epub,.xps,.md,.txt,.png,.jpg,.jpeg,.svg,.webp,.gif,.bmp,.tif,.tiff,application/pdf,image/*,text/markdown,text/plain" hidden>
<!-- 全屏时（打开时的样子，只有纸）：左上角是本子名和页码，点 ☰ 和本子名开抽屉，点页码出输入页码的小框（#pageJump，2026-11-16 夜起）；右下角一条。
     退出全屏后换成上面的顶栏和左侧工具栏 -->
<div id="chipRow">
  <button id="nbChip" aria-label="本子和页面"><span class="chip-menu" aria-hidden="true">☰<span class="new-dot" hidden></span></span><span id="chipName"></span><span id="chipPage"></span></button>
  <!-- 别的页有新回答（2026-11-16 用户定；夜里试过后改，暂定）：只有一页有——「● 第 3 页」，点了翻过去；几页都有——「● 2 页有新回答 ▾」，
       点了在它下面出一张小单子（#newAnsList），每页一行；没有就不出 -->
  <button id="chipNew" class="new-ans-btn" hidden><span class="na-dot" aria-hidden="true"></span><span class="na-no"></span><span class="na-more" aria-hidden="true"></span></button>
  <!-- 全屏时没有顶栏，在这里翻页：这本不止一页就有（连续时也有）；第一页 ‹、最后一页 › 不能点 -->
  <button id="chipPrev" aria-label="上一页" hidden>‹</button>
  <button id="chipNext" aria-label="下一页" hidden>›</button>
  <!-- 单页 / 连续：并排的一对图标，挨在一起像一个两格的开关，当前的那个白底加粗边框；点哪个就是哪个，点已选中的不变；
       和抽屉里那组开关、顶栏上那一对同一个状态；只有一页的本子没有（页数到两页以上才出来）；说明长按看 -->
  <div class="pair" id="chipPair" role="group" hidden>
    <button id="chipSingle" data-v="single" data-icon="single" aria-label="单页：一页一页翻"></button>
    <button id="chipCont" data-v="flow" data-icon="cont" aria-label="连续：上下页接在一起"></button>
  </div>
  <!-- 加页图标（纸上一个加号）：在这一页后面加一张和它同方向的空白页（这一页横着就加横版，否则竖版），翻过去；
       和抽屉里那两个加页图标同一个办法 -->
  <button id="chipAdd" data-icon="addv" aria-label="在这一页后面加一张空白页" hidden></button>
</div>
<div id="trouble" role="status" hidden></div><!-- 只在出问题时出现：连不上电脑、有字没存上 -->
<div id="tools">
  <span class="fb-grip" id="toolsGrip" role="button" aria-label="按住拖动工具条">⋮⋮</span>
  <button id="toolsBars" aria-label="退出全屏：显示顶栏和左侧工具栏">退出全屏</button>
  <button data-tool="pen" class="on" data-icon="pen" aria-label="黑笔：你自己的推导和草稿"></button>
  <button data-tool="red" class="red-pen" data-icon="pen" aria-label="红笔：明确要 Claude 处理的事"></button>
  <button data-tool="eraser" data-icon="eraser" aria-label="橡皮：也能擦 Claude 的蓝字"></button>
  <button data-tool="lasso" data-icon="lasso" aria-label="套索：圈住你的几笔，按住框里拖到别处"></button>
  <button id="toolsUndo" data-icon="undo" aria-label="撤销"></button>
  <button id="toolsRedo" data-icon="redo" aria-label="恢复" disabled></button>
  <!-- 回答要多长（2026-11-17 用户定「事先一档」，样子暂定）：写着现在这一档（点一下 / 讲清楚 / 展开讲）和 ▾，点开在上面出 #sizePick 那张小单子；
       选了一直留着（记在这台设备上），交给 AI 时带上。和顶栏上的 #barSize 是同一个开关 -->
  <button id="sizeBtn" class="size-btn" data-size="clear" aria-label="回答要多长：点开选"><span class="sz-name">讲清楚</span><span class="sz-caret" aria-hidden="true">▾</span></button>
  <!-- 点了交给 Claude；交上去以后字跟着这一轮走：已交 / 排队中 / Claude 在看 / 在改文件，结束变回「AI」；这本只在本地时写「只在本地」 -->
  <button id="check">AI</button>
</div>
<script src="/static/katex/katex.min.js"></script>
<script src="/static/gesture.js"></script>
<script src="/static/turn.js"></script>
<script src="/static/brush.js"></script>
<script src="/static/straight.js"></script>
<script src="/static/lasso.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
<!-- 脚本没载全（网络抖了一下，上面某个文件没取到）：后面的脚本照样会跑、然后报错，页面开着但是坏的（2026-11-17 用户定）。
     这一段写在页面里（不是另一个文件，不会取不到），不靠别的脚本：缺了就自己重新加载一次；重新加载后还缺（一分钟以内），
     就在屏幕上方说一句、给一个「重新加载」，不再自己试（免得没完没了）。记在这个标签页里（sessionStorage 的 ink.reloadTry），到齐了就清掉。
     公式用的 KaTeX 不查：缺了只是公式排不出来，纸照样能写。这里的字不走 i18n.js（它也可能没取到）：中文、英文各写一句，按界面语言选 -->
<script>
(function () {
  var need = { Gesture: 'gesture.js', Turn: 'turn.js', Brush: 'brush.js', Straight: 'straight.js', Lasso: 'lasso.js', InkLang: 'i18n.js', __ink: 'app.js' };
  var missing = Object.keys(need).filter(function (k) { return !window[k]; }).map(function (k) { return need[k]; });
  var KEY = 'ink.reloadTry', tried = 0, canStore = true;
  try { tried = Number(sessionStorage.getItem(KEY)) || 0; } catch (e) { canStore = false; }
  if (!missing.length) { try { sessionStorage.removeItem(KEY); } catch (e) { /* */ } return; }
  if (canStore && (!tried || Date.now() - tried > 60000)) {
    try { sessionStorage.setItem(KEY, String(Date.now())); location.reload(); return; } catch (e) { /* 记不了：不自己试，往下说一句 */ }
  }
  var zh = true;
  try { zh = /^zh/i.test(new URLSearchParams(location.search).get('lang') || localStorage.getItem('ink.lang') || navigator.language || 'zh'); } catch (e) { /* */ }
  var bar = document.createElement('div'), say = document.createElement('span'), btn = document.createElement('button');
  bar.id = 'loadTrouble';
  bar.setAttribute('role', 'alert');
  bar.style.cssText = 'position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:1000;'
    + 'max-width:calc(100vw - 24px);box-sizing:border-box;padding:10px 12px;display:flex;align-items:center;gap:10px;'
    + 'background:#fffdf8;border:1px solid #d9d3c6;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);color:#222;'
    + 'font:15px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  say.textContent = zh ? '页面没载全（缺 ' + missing.join('、') + '），可能写不了字。'
    : 'The page did not load completely (missing ' + missing.join(', ') + '). Writing may not work.';
  btn.id = 'loadTroubleBtn';
  btn.textContent = zh ? '重新加载' : 'Reload';
  btn.style.cssText = 'flex:none;height:44px;padding:0 16px;border:1px solid #2f5fae;border-radius:8px;background:#2f5fae;color:#fff;font:inherit;font-weight:600';
  btn.addEventListener('click', function () { try { sessionStorage.removeItem(KEY); } catch (e) { /* */ } location.reload(); });
  bar.appendChild(say);
  bar.appendChild(btn);
  document.body.appendChild(bar);
})();
</script>
</body>
</html>
